<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Deep Luxury Midnight Navy -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141927" />
      <stop offset="50%" stop-color="#0f131f" />
      <stop offset="100%" stop-color="#070910" />
    </linearGradient>

    <!-- Vibrant Coral & Amber Atmosphere Glow -->
    <radialGradient id="coralGlow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#ff3b68" stop-opacity="0.32" />
      <stop offset="55%" stop-color="#ff3b68" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ff3b68" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="sunGlow" cx="72%" cy="28%" r="40%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3" />
      <stop offset="60%" stop-color="#ff3b68" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>

    <!-- Metallic Airplane Gradient -->
    <linearGradient id="planeBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="65%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>

    <linearGradient id="planeWingLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <linearGradient id="planeWingRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <!-- Coral to Golden Amber Gradient for Flight Path & Compass -->
    <linearGradient id="flightPath" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff3b68" stop-opacity="0.1" />
      <stop offset="40%" stop-color="#ff3b68" stop-opacity="0.75" />
      <stop offset="80%" stop-color="#fbbf24" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <linearGradient id="goldStar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Smooth Drop Shadows -->
    <filter id="planeShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.55" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#ff3b68" flood-opacity="0.25" />
    </filter>

    <filter id="starGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 1. Squircle App Icon Base -->
  <rect width="512" height="512" rx="118" fill="url(#bgGrad)" />

  <!-- 2. Ambient Lighting Layer -->
  <rect width="512" height="512" rx="118" fill="url(#coralGlow)" />
  <rect width="512" height="512" rx="118" fill="url(#sunGlow)" />

  <!-- 3. Glass Inner Border -->
  <rect x="2" y="2" width="508" height="508" rx="116" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="3" />

  <!-- 4. Modern Stylized Globe / Compass Coordinates in Background -->
  <g opacity="0.22" transform="translate(256, 276)">
    <!-- Globe Outer Ring -->
    <circle cx="0" cy="0" r="148" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="6 6" />
    <!-- Equator and Longitude Arcs -->
    <ellipse cx="0" cy="0" rx="148" ry="58" fill="none" stroke="#94a3b8" stroke-width="2" />
    <ellipse cx="0" cy="0" rx="72" ry="148" fill="none" stroke="#94a3b8" stroke-width="2" />
    <line x1="-148" y1="0" x2="148" y2="0" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4" />
    <line x1="0" y1="-148" x2="0" y2="148" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4" />
  </g>

  <!-- 5. Ascending Flight Trajectory Arc (Curved swoop) -->
  <path d="M 88 410 C 130 380, 160 300, 220 250 C 270 208, 330 180, 395 155" 
        fill="none" 
        stroke="url(#flightPath)" 
        stroke-width="6" 
        stroke-linecap="round" 
        stroke-dasharray="14 10" />

  <!-- Tiny trail particles -->
  <circle cx="118" cy="382" r="3.5" fill="#ff3b68" opacity="0.6" />
  <circle cx="160" cy="328" r="4.5" fill="#ff3b68" opacity="0.75" />
  <circle cx="212" cy="265" r="5" fill="#fbbf24" opacity="0.85" />
  <circle cx="272" cy="222" r="5.5" fill="#fbbf24" opacity="0.95" />

  <!-- 6. Hero 3D Jet Airplane (Heading at 42° dynamic climb) -->
  <g transform="translate(305, 195) rotate(-42)" filter="url(#planeShadow)">
    <!-- Airplane Body Fuselage -->
    <path d="M 0 -105 C 10 -90, 15 -20, 14 60 C 14 78, 9 92, 0 98 C -9 92, -14 78, -14 60 C -15 -20, -10 -90, 0 -105 Z" 
          fill="url(#planeBody)" />

    <!-- Jet Cockpit Glass Window -->
    <path d="M -5 -78 C -2 -85, 2 -85, 5 -78 C 6 -72, -6 -72, -5 -78 Z" 
          fill="#1e293b" />

    <!-- Left Swept Wing (Illuminated top side) -->
    <path d="M -11 -12 L -95 38 C -102 43, -100 50, -88 48 L -12 28 Z" 
          fill="url(#planeWingLeft)" />

    <!-- Right Swept Wing (Shadowed underside) -->
    <path d="M 11 -12 L 95 38 C 102 43, 100 50, 88 48 L 12 28 Z" 
          fill="url(#planeWingRight)" />

    <!-- Left Jet Engine -->
    <rect x="-42" y="14" width="8" height="26" rx="4" fill="#64748b" />
    <ellipse cx="-38" cy="40" rx="3" ry="1.5" fill="#ff3b68" />

    <!-- Right Jet Engine -->
    <rect x="34" y="14" width="8" height="26" rx="4" fill="#475569" />
    <ellipse cx="38" cy="40" rx="3" ry="1.5" fill="#ff3b68" />

    <!-- Tail Stabilizers (Rear Fins) -->
    <path d="M -5 74 L -36 94 C -40 97, -38 101, -32 99 L -3 88 Z" fill="#94a3b8" />
    <path d="M 5 74 L 36 94 C 40 97, 38 101, 32 99 L 3 88 Z" fill="#64748b" />
    <!-- Vertical Tail Fin -->
    <path d="M 0 54 L 0 95" stroke="#e2e8f0" stroke-width="4" stroke-linecap="round" />
    <!-- Coral Jet Tip Accent -->
    <path d="M 0 -105 C 4 -99, 4 -95, 0 -92 C -4 -95, -4 -99, 0 -105 Z" fill="#ff3b68" />
  </g>

  <!-- 7. Shining Guide Star (Guiding the Adventure at Top-Right) -->
  <g transform="translate(402, 112)" filter="url(#starGlow)">
    <!-- 8-point Sparkle Star -->
    <path d="M 0 -22 Q 0 0, 22 0 Q 0 0, 0 22 Q 0 0, -22 0 Q 0 0, 0 -22 Z" fill="url(#goldStar)" />
    <circle cx="0" cy="0" r="5" fill="#ffffff" />
    <!-- Small star diagonals -->
    <line x1="-10" y1="-10" x2="10" y2="10" stroke="#fef08a" stroke-width="2" stroke-linecap="round" opacity="0.8" />
    <line x1="10" y1="-10" x2="-10" y2="10" stroke="#fef08a" stroke-width="2" stroke-linecap="round" opacity="0.8" />
  </g>

  <!-- Secondary subtle star -->
  <g transform="translate(142, 148)" opacity="0.85">
    <path d="M 0 -12 Q 0 0, 12 0 Q 0 0, 0 12 Q 0 0, -12 0 Q 0 0, 0 -12 Z" fill="#fde047" />
    <circle cx="0" cy="0" r="2.5" fill="#ffffff" />
  </g>

  <!-- 8. Sleek Bottom Badge: "2026" / Travel Pill -->
  <g transform="translate(256, 436)">
    <!-- Frosted pill capsule -->
    <rect x="-84" y="-18" width="168" height="36" rx="18" 
          fill="rgba(255, 255, 255, 0.08)" 
          stroke="rgba(255, 59, 104, 0.4)" 
          stroke-width="1.5" />
    
    <!-- Mini Coral Pin -->
    <circle cx="-56" cy="0" r="4" fill="#ff3b68" />
    <circle cx="-56" cy="0" r="7" fill="none" stroke="#ff3b68" stroke-width="1.5" opacity="0.5" />

    <!-- Modern Typography: 2026 VIAJE -->
    <text x="7" y="5" 
          text-anchor="middle" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="13" 
          font-weight="900" 
          letter-spacing="2.8" 
          fill="#f8fafc">
      EUROPA 2026
    </text>
  </g>
</svg>
