<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#042f2e" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <linearGradient id="orange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="128" fill="url(#bg)" />
  
  <!-- Outer Glow circle -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#14b8a6" stroke-width="8" opacity="0.4" stroke-dasharray="16 12" />
  
  <!-- Cool Travel Duck / Mascot with Sunglasses & Compass -->
  <g transform="translate(116, 116) scale(0.55)">
    <!-- Duck Body -->
    <path d="M 260 120 C 350 120 400 180 390 260 C 380 340 330 420 220 420 C 120 420 70 360 80 290 C 85 240 120 210 160 210 C 160 160 200 120 260 120 Z" fill="url(#gold)" />
    
    <!-- Duck Wing with travel backpack strap -->
    <path d="M 230 260 C 310 260 330 330 290 370 C 240 400 190 350 190 300 Z" fill="#ca8a04" opacity="0.8" />
    <path d="M 180 230 L 250 370" stroke="#f97316" stroke-width="16" stroke-linecap="round" />
    
    <!-- Duck Beak -->
    <path d="M 140 220 C 80 220 40 240 30 260 C 70 280 130 270 160 250 Z" fill="url(#orange)" />
    
    <!-- Stylish Sunglasses -->
    <rect x="150" y="180" width="75" height="48" rx="14" fill="#0f172a" stroke="#ffffff" stroke-width="4" />
    <rect x="235" y="180" width="75" height="48" rx="14" fill="#0f172a" stroke="#ffffff" stroke-width="4" />
    <path d="M 220 200 L 240 200" stroke="#ffffff" stroke-width="6" stroke-linecap="round" />
    <path d="M 160 190 L 175 215" stroke="#38bdf8" stroke-width="4" opacity="0.8" stroke-linecap="round" />
    <path d="M 245 190 L 260 215" stroke="#38bdf8" stroke-width="4" opacity="0.8" stroke-linecap="round" />
    
    <!-- Explorer Hat -->
    <path d="M 180 140 C 180 90 320 90 320 140 Z" fill="#78350f" />
    <ellipse cx="250" cy="140" rx="90" ry="18" fill="#92400e" />
    <rect x="200" y="130" width="100" height="10" fill="#f59e0b" />
  </g>

  <!-- Little Paper Airplane / Travel Accent -->
  <path d="M 370 120 L 420 90 L 400 140 L 385 115 Z" fill="#38bdf8" />
  <path d="M 370 120 L 400 140" stroke="#0284c7" stroke-width="2" />
</svg>
